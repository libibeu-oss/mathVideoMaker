<script>
"use strict";

const add=(h,parent=stage)=>{const e=$(h);parent===stage?stage.insertBefore(e,flash):parent.appendChild(e);return e};
const BEAT=0.4651,DROP=15.0;
const SFX=[];const sfx=(t,name,g=1)=>SFX.push({t:+t.toFixed(3),name,g});
const popIn=(el,t,t0,d=.22,base='')=>{const k=P(t,t0,t0+d);el.style.opacity=k>0?1:0;el.style.transform=`${base} scale(${k>0?back(k):0})`;return k};

/* ================= A: problem (0-13) ================= */
const A=add(`<div class="layer" id="A"></div>`);

[q1,q2,q3].forEach(e=>e.style.display='inline-block');
sfx(13.05,'riser',.8);sfx(DROP,'drop',1);

/* ================= B: solution (15-25.4) ================= */
const B=add(`<div class="layer" id="B"><div class="ph" style="background-image:url(photos/19_bded670b.webp)"></div></div>`);
const bph=B.querySelector('.ph');
const DR=rng(4242);DR();DR();const dots=[...Array(16)].map((_,i)=>{const r=DR;const s=20+r()*70;const e=add(`<div class="dot" style="width:${s}px;height:${s}px;background:${['#ff3fd0','#33d6ff','#a24bff','#ffb340'][i%4]};opacity:${.25+r()*.35}"></div>`,B);return {e,x:r()*1080,y:r()*1920,v:20+r()*50,ph:r()*6}});

const chips=CHIPS.map(c=>{const e=add(`<div class="chip" style="background:${c[1]};left:${c[2]}px;top:${c[3]}px">${c[0]}</div>`,B);return e});

const rings=[0,1,2].map(()=>add(`<div class="ring"></div>`,B));
// screen segments: [start,end, folder, capStart, capEnd]
const SEG=[[15.8,19.25,'s2',.35,3.85],[19.25,21.25,'s5',0,1.9],[21.25,23.3,'s3',.55,3.6],[23.3,25.45,'s4',0,2.1]];
SEG.slice(1).forEach(s=>sfx(s[0],'swoosh',.6));
// tap targets (css px in 390-wide viewport) from capture rects
let RECTS={s3_house:[77.6,153.1,143.2,157.5],s4_follow:[167.2,540.6,117.6,52]};
const capCaps=[[15.8,19.25,'כל המסיבות<br>במקום <span class="pink">אחד.</span>'],[19.25,21.25,'מה קורה<br><span class="pink">סביבכם</span> הערב'],[21.25,23.3,'בוחרים<br><span class="pink">וייב.</span>'],[23.3,25.45,'עוקבים אחרי<br><span class="pink">האמנים.</span>']];

/* ================= E: end (25.45-31) ================= */
const E=add(`<div class="layer" id="E"></div>`);
const SR=rng(977);SR();SR();const sparks=[...Array(46)].map((_,i)=>{const r=SR;const a=r()*Math.PI*2,sp=380+r()*620;const e=add(`<div class="spark" style="background:${['#ff3fd0','#33d6ff','#ffb340','#fff','#a24bff'][i%5]}"></div>`,E);return {e,a,sp,d:.9+r()*.8}});
const elogo=add(`<div style="position:absolute;left:280px;top:420px;width:520px"><img src="logo_card.png" style="width:520px;border-radius:84px;box-shadow:0 0 140px rgba(255,63,208,.5)"></div>`,E);
const el1=add(`<div style="position:absolute;left:0;right:0;top:1030px;text-align:center;direction:rtl;font-weight:900;font-size:104px;line-height:1.05">לאן הולכים?<br><span class="pink">אני בפנים.</span></div>`,E);
const el2=add(`<div style="position:absolute;left:0;right:0;top:1340px;text-align:center"><span style="display:inline-block;padding:20px 44px;border-radius:60px;background:#fff;color:#16121c;font-weight:800;font-size:44px;direction:rtl">בקרוב ב־App Store וב־Google Play</span></div>`,E);
const el3=add(`<div style="position:absolute;left:0;right:0;top:1480px;text-align:center;font-weight:700;font-size:56px;letter-spacing:2px;direction:ltr">wawg.live</div>`,E);
sfx(25.5,'boom',.8);sfx(25.75,'chime',.6);

const show=(l,a,b,t)=>{const on=t>=a&&t<b;l.style.display=on?'block':'none';return on};
const pending=[];
window.R=async function(t){
  /* ---- A ---- */
  if(show(A,0,13,t)){
    const g=Math.max(0,t-9.75),fall=y=>`translateY(${900*g*g}px) rotate(${g*40}deg)`; // gravity after 9.75
    // caption
    let c='',ck=0;
    if(t<3.6){c='חמישי.<br><span class="pink">22:00.</span>';ck=P(t,.25,.6)}
    else if(t<5.55){c=`${Math.max(1,Math.round(20*eo(P(t,3.55,5.4))))} קבוצות.`;ck=1}
    else if(t<7.6){c='סטוריז<br>ש<span class="pink">נעלמים.</span>';ck=P(t,5.55,5.8)}
    else if(t<9.75){c='"<span class="pink">לינק</span>?"';ck=P(t,7.6,7.85)}
    else if(t>=10.35){c='עוד ערב<br>על <span class="pink">הספה.</span>';ck=P(t,10.35,10.65)}
    capA.innerHTML=c;capA.style.opacity=ck;capA.style.transform=`translateY(${(1-eo(ck))*30}px)`;
    // phone + badge
    const pk=eo(P(t,.1,.5));const n=cards.filter(o=>t>=o.t0).length+stories.filter(o=>t>=o.t0).length+bubs.filter(o=>t>=o.t0).length;
    badge.textContent=n>0?(n>=20?'99+':String(n*4)):'0';badge.style.opacity=n>0?1:0;
    const shake=t>3.5&&t<9.75?Math.sin(t*80)*Math.min(8,(t-3.5)*1.5):0;
    fph.style.opacity=t<10.6?1:0;fph.style.transform=`translateX(${shake}px) scale(${lerp(.85,1,pk)}) ${t>9.75?fall(0):''}`;
    cards.forEach(o=>{if(t<o.t0){o.e.style.opacity=0;return}const k=P(t,o.t0,o.t0+.2);o.e.style.opacity=1;o.e.style.transform=`rotate(${o.rot}deg) scale(${back(k)}) ${t>9.75?fall():''}`});
    stories.forEach(o=>{const lt=t-o.t0;if(lt<0||lt>1.25){o.e.style.opacity=0;return}
      const k=P(lt,0,.2),v=P(lt,1.05,1.25),left=1-P(lt,.15,1.05);o.e.style.opacity=1-v;
      o.e.style.background=`conic-gradient(#ff3fd0 ${left*360}deg,#d6cfc4 0)`;o.e.style.transform=`scale(${k<1?back(k):1+v*.4})`});
    bubs.forEach(o=>{if(t<o.t0){o.e.style.opacity=0;return}const k=P(t,o.t0,o.t0+.2);o.e.style.opacity=1;o.e.style.transform=`rotate(${o.rot}deg) scale(${back(k)}) ${t>9.75?fall():''}`});
    const sk=P(t,9.05,9.3);stamp.style.opacity=sk>0?1:0;stamp.firstChild.style.transform=`rotate(-10deg) scale(${sk>0?lerp(2.2,1,eo(sk)):0}) ${t>9.75?fall():''}`;
    // sofa

    zz.forEach((z,i)=>{const lt=t-(11+i*.5);if(lt<0){z.style.opacity=0;return}const p=(lt%1.6)/1.6;z.style.opacity=Math.sin(p*Math.PI);z.style.left=(690+i*50+p*40)+'px';z.style.top=(980-i*60-p*160)+'px'});
    A.style.opacity=1-P(t,12.7,13);
  }
  /* ---- Q ---- */
  if(show(Q,13,DROP,t)){popIn(q1,t,13.15);popIn(q2,t,13.5);popIn(q3,t,13.95,.25);
    const imp=eio(P(t,14.55,15));qq.style.transform=`scale(${1-imp*.98}) rotate(${imp*-20}deg)`;qq.style.opacity=1-P(t,14.85,15)}
  /* ---- B ---- */
  if(show(B,DROP,25.45,t)){const bt=t-DROP;
    bph.style.transform=`scale(${1.1+bt*.01})`;
    dots.forEach(d=>{d.e.style.left=(d.x+Math.sin(bt*.7+d.ph)*30)+'px';d.e.style.top=((d.y-bt*d.v)%1920+1920)%1920+'px'});
    // icon burst 15-15.9 then phone rises
    const ik=P(t,DROP,DROP+.3),io=P(t,15.55,15.85);icon.style.display=io<1?'block':'none';
    icon.style.transform=`scale(${ik>0?back(ik)*(1+io*1.6):0})`;icon.style.opacity=1-io;
    rings.forEach((r,i)=>{const k=P(t,DROP+i*.12,DROP+i*.12+.7);const s=40+k*1100;r.style.width=r.style.height=s+'px';r.style.margin=`${-s/2}px 0 0 ${-s/2}px`;r.style.opacity=k>0&&k<1?(1-k):0});
    const pr=eo(P(t,15.55,16.05));phone.style.opacity=pr;phone.style.transform=`translateY(${(1-pr)*500}px) scale(${lerp(.8,1,pr)})`;
    wm.style.opacity=.9*pr;
    // screens
    const seg=SEG.find(s=>t>=s[0]&&t<s[1])||SEG[0];const f=lerp(seg[3],seg[4],P(t,seg[0],seg[1]));
    const idx=Math.min({s2:119,s3:119,s4:119,s5:149}[seg[2]],Math.max(0,Math.round(f*30)));
    const src=`cap/${seg[2]}/${String(idx).padStart(4,'0')}.jpg`;if(!scr.src.endsWith(src)){scr.src=src;pending.push(scr.decode().catch(()=>{}))}
    // per-segment push-in on cut
    const sk=eo(P(t,seg[0],seg[0]+.3));phone.querySelector('.scr').style.transform=`scale(${t<16?1:lerp(1.04,1,sk)})`;
    // taps
    let tp=null,tt=0;const S=600/390;
    if(seg[2]==='s3'){tt=21.25+(1.0-seg[3])/((seg[4]-seg[3])/(seg[1]-seg[0]));tp=RECTS.s3_house}

    if(tp){const k=P(t,tt-.15,tt+.35);tap.style.left=(tp[0]+tp[2]/2)*S+'px';tap.style.top=(tp[1]+tp[3]/2)*S+'px';tap.style.opacity=k>0&&k<1?Math.sin(k*Math.PI):0;tap.style.transform=`scale(${.6+k*.7})`}else tap.style.opacity=0;
